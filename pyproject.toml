[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "multilayer-perceptron"
version = "0.1.0"
description = "A modular Multilayer Perceptron built from scratch"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "pytest", "joblib", "matplotlib"]

[tool.setuptools]
packages = ["utils", "mlp"]
